[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaspa-sdk"
version = "0.1.0"
description = "Python SDK for the Kaspa blockchain network"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "ISC"}
authors = [
    {name = "Kaspa Developers", email = "dev@kaspa.org"}
]
maintainers = [
    {name = "Kaspa Developers", email = "dev@kaspa.org"}
]
keywords = [
    "kaspa",
    "blockchain",
    "cryptocurrency",
    "sdk",
    "wallet",
    "rpc",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: ISC License (ISCL)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "websockets>=11.0",
    "cryptography>=41.0.0",
    "mnemonic>=0.20",
    "base58>=2.1.0",
    "pycryptodome>=3.18.0",
    "typing-extensions>=4.5.0; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
    "sphinx>=7.1.0",
    "sphinx-rtd-theme>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/kaspanet/rusty-kaspa"
Documentation = "https://kaspa.aspectron.org/"
Repository = "https://github.com/kaspanet/rusty-kaspa.git"
Issues = "https://github.com/kaspanet/rusty-kaspa/issues"
Changelog = "https://github.com/kaspanet/rusty-kaspa/blob/master/python/CHANGELOG.md"

[tool.setuptools]
packages = ["kaspa_sdk", "kaspa_sdk.rpc", "kaspa_sdk.wallet", "kaspa_sdk.transaction", "kaspa_sdk.crypto", "kaspa_sdk.utils"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.tox
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "mnemonic.*",
    "base58.*",
]
ignore_missing_imports = true
